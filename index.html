<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e5b">
<meta name="description" content="Латинская анатомическая терминология — уроки, карточки, словарь. Работает офлайн.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Латынь">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Латинская анатомия — минимум</title>
<style>
:root{
  --bg:#f6f6f3;--surface:#ffffff;--surface2:#f0f0ec;--line:#e4e4df;--text:#1f2120;--muted:#6f726f;
  --accent:#2f9e5b;--accent-ink:#ffffff;--accent-soft:#e3f3e9;--accent-dark:#23804a;
  --bad:#c8493f;--bad-soft:#fbe9e7;--warn:#d98a1c;--lat:#1d4f86;
  --radius:16px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121413;--surface:#1b1e1c;--surface2:#232725;--line:#2e3330;--text:#ebecea;--muted:#9aa09c;
  --accent:#3bb06a;--accent-ink:#0d1a12;--accent-soft:#1c3326;--accent-dark:#2e9257;--bad:#e2685e;--bad-soft:#3a2220;--lat:#9cc3ef;
  --shadow:none;}}
:root[data-theme=dark]{
  --bg:#121413;--surface:#1b1e1c;--surface2:#232725;--line:#2e3330;--text:#ebecea;--muted:#9aa09c;
  --accent:#3bb06a;--accent-ink:#0d1a12;--accent-soft:#1c3326;--accent-dark:#2e9257;--bad:#e2685e;--bad-soft:#3a2220;--lat:#9cc3ef;
  --shadow:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.lat{font-family:var(--serif);color:var(--lat)}
.muted{color:var(--muted)}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pill.streak{color:var(--warn)} .pill.streak.off{color:var(--muted)}
.pill.xp{color:var(--accent)}
.content{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px calc(84px + var(--safe-b))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:.75rem;color:var(--muted);font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
h2.sec{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:1rem;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dark);transition:transform .06s,box-shadow .06s;width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:40px;font-size:.9rem;padding:0 14px;width:auto}

/* ---------- home ---------- */
.home{display:grid;gap:16px}
.hero{padding:18px;display:grid;gap:14px}
.hero .goal{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--surface2)} .ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.goal b{display:block;font-size:1.05rem}
.next-title{font-size:.85rem;color:var(--muted)}
.hero-actions{display:grid;gap:10px}
.hero .review-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero .review-line b{font-size:1.05rem}
.storage-warn{padding:12px 14px;font-size:.88rem;background:var(--bad-soft);border-color:transparent;color:var(--text)}
.units{display:grid;gap:12px}
.unit{padding:16px}
.unit-head{display:flex;align-items:center;gap:8px}
.unit-head h3{margin:0;font-size:1.05rem;flex:1;min-width:0}
.unit-head .cnt{font-size:.85rem;color:var(--muted);white-space:nowrap}
.unit-reset{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted);margin-right:-4px}
.unit-reset svg{width:18px;height:18px}
.unit-reset:active{background:var(--surface2)}
.ph-head{display:flex;align-items:flex-start;gap:8px;margin:0 0 2px}
.ph-head .ph-title{flex:1;min-width:0;font-weight:750;font-size:1rem;line-height:1.3}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.lessons{display:flex;flex-wrap:wrap;gap:8px}
.lesson-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.lesson-dot{flex:none;padding:0}.lesson-dot svg{width:20px;height:20px}
.card.search{min-width:0}.card.search input{min-width:0;width:100%}
.lesson-dot.passed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lesson-dot.passed.learning{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lesson-dot.next{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lesson-dot:active{transform:scale(.95)}

/* ---------- dictionary ---------- */
.dict-tools{display:grid;gap:10px;position:sticky;top:calc(57px + var(--safe-t));z-index:3;background:var(--bg);padding:4px 0 10px}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:48px}
.search input{flex:1;border:0;background:none;outline:none;font-size:1rem;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:600;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dict-list{display:grid;gap:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t .lat{font-size:1.08rem}
.row .t .ru{font-size:.92rem;color:var(--muted)}
.row .t .nt{font-size:.8rem;color:var(--muted);font-style:italic}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--surface2)}
.dots i.f{background:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:active{background:var(--surface2)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;padding:16px 16px 10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--muted)}
.week div i{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--surface2);min-height:4px}
.week div i.f{background:var(--accent)}
.settings{overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-height:58px}
.set:first-child{border-top:0}
.set label,.set .lbl{flex:1}
.set small{display:block;color:var(--muted);font-size:.8rem}
.set select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:52%}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{transform:translateX(20px)}
.set-actions{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}

/* ---------- session (lesson) ---------- */
.session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.s-top{display:flex;align-items:center;gap:14px;padding:calc(12px + var(--safe-t)) 16px 8px;max-width:820px;width:100%;margin:0 auto}
.s-prog{flex:1;height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:7px;transition:width .35s ease}
.s-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;width:100%;max-width:820px;margin:0 auto;padding:12px 20px 20px}
.q-kind{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 6px}
.q-title{font-size:1.35rem;font-weight:700;margin:0 0 18px}
.prompt{display:flex;align-items:center;gap:12px;margin:4px 0 22px;flex-wrap:wrap}
.prompt .big{font-size:2rem;line-height:1.2;word-break:break-word}
.prompt .big.ru{font-family:var(--sans);color:var(--text);font-weight:650}
.prompt .gram{font-size:1rem;color:var(--muted);font-family:var(--serif)}
.speak{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.speak svg{width:24px;height:24px}
.speak:active{transform:scale(.95)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:12px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.05rem;transition:transform .06s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.78rem;color:var(--muted);font-weight:700}
.opt.lat-opt{font-family:var(--serif);color:var(--lat);font-size:1.12rem}
.opt.right{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt.dim{opacity:.5}
.opts.locked .opt{pointer-events:none}
.kl-t{border-collapse:collapse;margin:8px auto;font-size:.85rem}.kl-t th,.kl-t td{border:1px solid var(--line,#ccc);padding:4px 6px;text-align:center}.kl-th{text-align:left;font-size:.92rem;display:grid;gap:6px}.kl-th p{margin:0}.kl-parse{text-align:left;font-size:.9rem;display:grid;gap:4px;width:100%}.kl-intro .lat{font-size:1.7rem}.kl-parse .lat,.kl-th .lat{font-size:1.15rem!important;line-height:1.3}.kl-steps .btn{flex-direction:column;padding:8px 4px;font-size:.9rem;line-height:1.2;min-width:0}.kl-steps small{font-weight:400;font-size:.72rem;opacity:.85}.kr-card .kl-l{width:auto;display:inline-flex}.ph-box{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft,#eef6ff)}
.intro{padding:26px 22px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:8px}
.intro .badge{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.intro .lat{font-size:2.3rem;line-height:1.15}
.intro .gram{font-family:var(--serif);color:var(--muted);font-size:1.1rem}
.intro .ru{font-size:1.3rem;font-weight:650}
.intro .nt{font-size:.92rem;color:var(--muted)}
.type-wrap{display:grid;gap:10px}
.type-in{width:100%;height:60px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 16px;font-size:1.3rem;font-family:var(--serif);color:var(--lat);outline:none}
.wr-bad{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:700;text-decoration:underline}
.type-in:focus{border-color:var(--accent)}
.type-in.right{border-color:var(--accent);background:var(--accent-soft)}
.type-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:.88rem;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{justify-content:center;text-align:center;min-height:56px;padding:10px}
.match .opt.sel{border-color:var(--lat);box-shadow:0 3px 0 var(--lat)}
.match .opt.gone{opacity:.28;pointer-events:none;box-shadow:none}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.s-foot{border-top:1px solid var(--line);background:var(--surface);padding:14px 20px calc(14px + var(--safe-b))}
.s-foot .in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.s-foot.ok{background:var(--accent-soft);border-color:transparent}
.s-foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.s-foot.ok .fb .ic{background:var(--accent)} .s-foot.bad .fb .ic{background:var(--bad)}
.fb b{display:block;font-size:1.1rem}
.s-foot.ok .fb b{color:var(--accent-dark)} .s-foot.bad .fb b{color:var(--bad)}
.fb .ans{font-size:1rem;margin-top:2px}
.fb .ans .lat{font-size:1.08rem}
.s-foot .row2{display:flex;gap:10px}
.s-foot .row2 .btn.ghost{flex:0 0 auto;width:auto}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
/* flashcards */
.flash{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.fcard{min-height:260px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;user-select:none}
.fcard .lat{font-size:2.1rem;line-height:1.2}
.fcard .gram{font-family:var(--serif);color:var(--muted)}
.fcard .ru{font-size:1.35rem;font-weight:650}
.fcard .tap{font-size:.85rem;color:var(--muted)}
/* done screen */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 0}
.done .seal{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.done .seal svg{width:52px;height:52px;stroke-width:3}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.done h2{margin:0;font-size:1.8rem}
.done p{margin:0;color:var(--muted)}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}
.done-stats .stat{text-align:center;padding:14px 8px}
.done-stats .stat b{font-size:1.45rem}
.streak-note{font-weight:700;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* ---------- tablet & wide ---------- */
@media (min-width:600px){
  .opts.two{grid-template-columns:1fr 1fr}
  .prompt .big{font-size:2.4rem}
  .intro .lat{font-size:2.8rem}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:768px){
  html,body{font-size:17px}
  .content{padding:24px 28px calc(28px + var(--safe-b))}
  .tabbar{position:sticky;top:0;bottom:auto;left:auto;right:auto;order:-1;background:none;border:0;padding:0;gap:4px;width:auto}
  .tabbar button{flex-direction:row;gap:8px;font-size:.92rem;padding:8px 14px;border-radius:10px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button.on{background:var(--accent-soft)}
  .topbar{padding-left:28px;padding-right:28px}
  .tabslot{display:flex}
  .units{grid-template-columns:1fr 1fr}
  .home{grid-template-columns:minmax(280px,340px) 1fr;align-items:start;gap:24px}
  .home .side{position:sticky;top:calc(84px + var(--safe-t));display:grid;gap:16px}
  .home .side h2.sec:first-child{margin-top:0}
  .home .main h2.sec:first-child{margin-top:0}
  .dict-tools{top:calc(65px + var(--safe-t))}
  .dict-list{grid-template-columns:1fr 1fr}
  .dict-list .row:nth-child(2){border-top:0}
  .dict-list .row:nth-child(odd){border-right:1px solid var(--line)}
  .s-body{padding:28px 32px}
  .q-title{font-size:1.6rem}
  .opt{min-height:64px;font-size:1.12rem}
  .toast{bottom:32px}
  .stats-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .stats-layout h2.sec:first-child{margin-top:0}
}
@media (min-width:768px) and (max-width:899px) and (orientation:portrait){
  .home{grid-template-columns:1fr}
  .home .side{position:static;grid-template-columns:1fr 1fr;align-items:start}
  .home .side h2.sec{grid-column:1/-1}
}
@media (min-width:1100px){ .units{grid-template-columns:1fr 1fr} }
@media (max-height:520px) and (orientation:landscape){
  .prompt{margin-bottom:12px} .q-title{margin-bottom:10px} .opts.two,.opts{grid-template-columns:1fr 1fr} .opt{min-height:50px}
  .intro{padding:14px} .done .seal{width:64px;height:64px}
}
@media (min-width:768px) and (max-width:900px){ .brand span{display:none} }
@media (max-width:400px){ #flashBtn span{display:none} }
@media (max-width:370px){ .brand span{display:none} .prompt .big{font-size:1.7rem} .lesson-dot{width:40px;height:40px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- PWA: left/right safe areas (notch in landscape) ---------- */

/* ---------- session engine ----------
   Interleaved practice: every lesson word goes intro → recognition (choose translation) →
   reverse (choose Latin) → recall (type it / gender). Each step of the same word waits a few
   tasks (GAP_*), filled with other words — warm-up of due words, older words, other new words.
   New words come in small batches; a wrong answer comes back 3–5 tasks later (no lives). */
const GAP_INTRO = 4, GAP_OK = 3, BATCH = 3, WARMUP = 3;

function reviewType(w) {
  const s = ws(w).s, r = Math.random();
  if (s <= 1) return r < 0.55 ? "r2l" : "l2r";
  if (s === 2) return r < 0.5 ? "type" : "r2l";
  return multiGender(w) && r < 0.2 ? "gender" : "type";
}
function learnItem(w, fresh) { return { w, kind: "learn", fresh, stages: (fresh ? ["intro"] : []).concat(["l2r", "r2l", recallType(w)]), i: 0, ready: 0, misses: 0 }; }

  const words = UNITS[ui].lessons[li], inL = new Set(words.map(w => w.id));
  const due = dueWords().filter(w => !inL.has(w.id));
  const warm = due.slice(0, WARMUP);
  const older = shuffle(WORDS.filter(w => ws(w).seen && !inL.has(w.id) && !isDue(w))).sort((a, b) => ws(a).s - ws(b).s);
  const replay = !!((S.replayAt || {})[UNITS[ui].id]) && !lessonDone(ui, li);
  startSession({ mode: "lesson", ui, li, words, title: `${UNITS[ui].title} · урок ${li + 1}`,
    items: [...warm.map(w => revItem(w, "warm")), ...words.map(w => learnItem(w, !ws(w).seen || replay))],
    pool: [...due.slice(WARMUP, WARMUP + 8), ...older.slice(0, 12)] });
}
function startReview() {
  let words = dueWords().slice(0, 15), extra = false;
  if (words.length < 6) {
    const more = shuffle(WORDS.filter(w => ws(w).seen && !words.includes(w))).sort((a, b) => ws(a).s - ws(b).s || ws(b).bad - ws(a).bad);
    extra = !words.length; words = words.concat(more.slice(0, 6 - words.length));
  }
  if (!words.length) { toast("Сначала пройдите хотя бы один урок"); return; }
  const rest = shuffle(WORDS.filter(w => ws(w).seen && !words.includes(w))).slice(0, 6);
  startSession({ mode: "review", words, title: extra ? "Повторение слабых слов" : "Повторение", items: shuffle(words).map(w => revItem(w, "rev")), pool: [], spare: rest });
}
function startSession(o) {

    wrongWords: new Set(), introduced: new Set(), srsDone: new Set(), extraUsed: new Set(), matched: false,
    known: new Set(WORDS.filter(w => ws(w).seen).map(w => w.id)) });

}

}

  const ready = qs.filter(it => it.ready <= t && !recent.includes(it.w.id)).sort((a, b) => a.ready - b.ready || (a.kind === "rev" ? -1 : 1));
  if (ready.length) return ready[0];
  // 2) introduce the next new word — small batches, never two intros in a row when a review word can go between

  if (intros.length && active < BATCH && !(SES.lastT === "intro" && pool.length)) return intros[0];
  // 3) a filler: an older word between two tasks about the same new word
  if (pool.length) { const w = pool[0]; SES.pool.splice(SES.pool.indexOf(w), 1); return addItem(revItem(w, "fill")); }
  if (intros.length) return intros[0];
  // 4) words already finished in this session / spare known words get one more quick question
  const spare = SES.items.filter(it => it.done && it.kind === "learn" && !SES.extraUsed.has(it.w.id) && !recent.includes(it.w.id)).map(it => it.w)
    .concat((SES.spare || []).filter(w => !SES.extraUsed.has(w.id) && !recent.includes(w.id)));

}
function qLabel(st, dflt) {
  if (st.retry) return "Ещё раз";
  if (st.tag === "warm") return "Разминка · повторение";
  if (st.tag === "rev" || st.tag === "fill") return "Повторение";
  return dflt;
}
// a wrong pair in «match»: the word comes back 3 tasks later as a normal question
function requeueWord(w) { const it = revItem(w, "fill"); it.stages = ["l2r"]; it.retry = true; it.ready = SES.step + 3; SES.items.push(it); }
function onAnswer(ok, w) {
  const it = SES.item, r = rec(w);
  if (ok) r.ok++; else r.bad++;
  // the spaced-repetition box moves once per session, on the first answer about a word known before the session
  if (SES.known.has(w.id) && !SES.srsDone.has(w.id)) { srsAnswer(w, !!ok); SES.srsDone.add(w.id); }
  else if (!ok && SES.known.has(w.id)) { r.s = 1; r.due = Math.min(r.due, dueIn(1)); }
  if (ok) {
    it.i++; it.retry = false; it.ready = SES.step + GAP_OK;
    if (it.i >= it.stages.length) { it.done = true; if (it.kind === "learn" && it.fresh && !(SES.known && SES.known.has(w.id))) srsLearned(w); }
  } else {
    it.misses++; it.retry = true; it.ready = SES.step + 3 + Math.floor(Math.random() * 3); // back in 3–5 tasks
    SES.mistakes++; SES.wrongWords.add(w);
  }

}
function closeSession(force) {
  if (!force && SES && SES.done > 0 && !SES.finished && !confirm("Выйти из урока? Прогресс этого урока не сохранится, но изученные слова останутся.")) return;

  $("#session").classList.add("hidden"); $("#session").innerHTML = "";
  document.body.style.overflow = "";

function sessionFrame(body, foot) {
  const total = SES.done + SES.queue.length;
  const pct = SES.finished ? 100 : Math.max(SES.lastPct || 0, Math.min(97, (SES.done / Math.max(1, total)) * 100));
  $("#session").innerHTML = `<div class="s-top"><button class="icon-btn" id="sClose" aria-label="Закрыть">${IC.x}</button><div class="s-prog"><i style="width:${SES.lastPct || 0}%"></i></div></div>
    <div class="s-body">${body}</div>${foot}`;
  requestAnimationFrame(() => { const i = $("#session .s-prog i"); if (i) i.style.width = pct + "%"; SES.lastPct = pct; });
  $("#sClose").onclick = () => closeSession(false);
}
function footCheck(label = "Проверить", disabled = true, skip = true) {
  return `<div class="s-foot" id="foot"><div class="in"><div class="row2">${skip ? `<button class="btn ghost" id="skipBtn">Не знаю</button>` : ""}<button class="btn" id="checkBtn" ${disabled ? "disabled" : ""}>${label}</button></div></div></div>`;
}
function feedback(ok, answerHTML, w, extra = "") {
  const st = SES.cur;
  SES.answered++;
  if (ok) { SES.done++; if (!st.retry) SES.firstTry++; }
  if (w) { onAnswer(ok, w); if (S.settings.autoplay) speak(w); }
  const foot = $("#foot");
  foot.className = "s-foot " + (ok ? "ok" : "bad");
  foot.innerHTML = `<div class="in"><div class="fb"><div class="ic">${ok ? IC.check : IC.x}</div><div><b>${ok === "typo" ? "Почти верно" : ok ? sample(["Верно", "Отлично", "Правильно"], 1)[0] : "Неверно"}</b>
    <div class="ans">${answerHTML}</div>${extra}</div>${w && TTS.ok && S.settings.audio ? `<span style="margin-left:auto">${speakBtn(w)}</span>` : ""}</div>
    <button class="btn ${ok ? "" : "bad"}" id="contBtn">Дальше</button></div>`;

function wordAnswer(w) { return `${latHTML(w)} — ${esc(w.rus)}${w.note ? `<div class="hint">${esc(w.note)}</div>` : ""}`; }

function showType(st) {

    <div class="prompt"><span class="big ru">${esc(w.rus)}</span></div>${w.note && /подъязычн|ямка|шов|большой|малый|полость/.test(w.rus) ? `<div class="hint" style="margin:-12px 0 14px">Подсказка: ${esc(w.note.replace(new RegExp(w.head, "i"), "…"))}</div>` : ""}

function showMatch(st) {

    <div class="col">${right.map(w => `<button class="opt" data-id="${esc(w.id)}" data-side="r">${esc(w.rus)}</button>`).join("")}</div></div>`,
    `<div class="s-foot" id="foot"><div class="in"><div class="hint" style="text-align:center">Нажмите слово слева, затем перевод справа</div></div></div>`);

  mt.querySelectorAll(".opt").forEach(b => b.onclick = () => {

    sel[side] = b; b.classList.add("sel");

      if (a.dataset.id === c.dataset.id) {
        [a, c].forEach(x => { x.classList.remove("sel"); x.classList.add("right"); setTimeout(() => { x.classList.remove("right"); x.classList.add("gone"); }, 250); });
        left_n--;
      } else {
        errs++; SES.mistakes++;
        const ww = byId[a.dataset.id];
        // the confused word comes back later as a normal question
        if (!SES.wrongWords.has(ww) || !SES.items.some(it => !it.done && it.w === ww)) requeueWord(ww);
        SES.wrongWords.add(ww);
        [a, c].forEach(x => { x.classList.remove("sel"); x.classList.add("wrong", "shake"); setTimeout(() => x.classList.remove("wrong", "shake"), 400); });
      }
      sel = { l: null, r: null };
      if (!left_n) setTimeout(() => {
        SES.answered++; SES.done++; if (!errs) SES.firstTry++; SES.item.done = true;
        const foot = $("#foot"); foot.className = "s-foot ok";

  });
}
function finish() {
  SES.finished = true;
  const perfect = SES.mistakes === 0;
  const xp = 10 + (perfect ? 5 : 0);
  const firstToday = addXp(xp);
  if (SES.mode === "lesson") {
    const k = lessonKey(SES.ui, SES.li), prev = S.lessons[k];
    S.lessons[k] = { n: (prev ? prev.n : 0) + 1, at: Date.now() };
    SES.words.forEach(w => { if (!ws(w).seen) srsLearned(w); });
    save();
  }
  const acc = SES.answered ? Math.round(SES.firstTry / SES.answered * 100) : 100;
  const sec = Math.round((Date.now() - SES.t0) / 1000);
  const tm = sec >= 60 ? Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0") : sec + " с";
  const st = streak();
  const wrong = [...SES.wrongWords];
  const nx = nextLesson();
  const isLesson = SES.mode === "lesson";
  sessionFrame(`<div class="done"><div class="seal">${IC.check}</div>
    <h2>${isLesson ? "Урок пройден" : "Повторение завершено"}</h2>
    <p>${esc(SES.title)}</p>
    <div class="done-stats">
      <div class="card stat"><b style="color:var(--accent)">+${xp}</b><span>XP${perfect ? " · без ошибок" : ""}</span></div>
      <div class="card stat"><b>${acc}%</b><span>точность</span></div>
      <div class="card stat"><b>${tm}</b><span>время</span></div>
    </div>
    <div class="muted" style="max-width:520px">${isLesson ? "Новые слова вернутся на повторение завтра, потом через 3, 7, 14 и 30 дней." : (dueWords().length ? `Ещё на повторение: ${dueWords().length} ${plural(dueWords().length, "слово", "слова", "слов")}` : "На сегодня всё повторено.")}</div>
    ${firstToday ? `<div class="streak-note">${IC.flame} Серия: ${st} ${plural(st, "день", "дня", "дней")}</div>` : `<div class="muted">Сегодня: ${todayXp()} / ${S.settings.goal} XP</div>`}
    ${wrong.length ? `<div class="card" style="width:100%;max-width:520px;text-align:left;padding:4px 0"><div class="hint" style="padding:10px 14px 4px">Слова с ошибками — попадут в повторение</div>${wrong.map(w => `<div class="row"><div class="t"><div>${latHTML(w)}</div><div class="ru">${esc(w.rus)}</div></div>${speakBtn(w)}</div>`).join("")}</div>` : ""}
    </div>`,
    `<div class="s-foot" id="foot"><div class="in"><div class="row2">${isLesson && nx ? `<button class="btn ghost" id="homeBtn">На главную</button><button class="btn" id="contBtn">Следующий урок</button>` : `<button class="btn" id="homeBtn">Продолжить</button>`}</div></div></div>`);
  $("#homeBtn").onclick = () => closeSession(true);
  const c = $("#contBtn");
  if (c) { c.onclick = () => { closeSession(true); startLesson(nx[0], nx[1]); }; c.focus({ preventScroll: true }); } else $("#homeBtn").focus({ preventScroll: true });
}

    <div class="hint">${isP ? "Следите за окончаниями: согласование и родительный падеж" : "Именительный падеж"}</div></div>`, footCheck());

    SES.q.shift();

/* ---------- final sheet test per unit ("Итоговый тест") ---------- */
const FT_KEY = "latAnat.finalTest"; // { unitId: { lr: {ok, n}, rl: {ok, n} } } — best full-sheet score
let FT = null;
function ftBest() { try { return JSON.parse(lsGet(FT_KEY) || "{}") || {}; } catch (e) { return {}; } }
function ftSaveBest(uid, sheet, ok, n) {
  const b = ftBest(), u = b[uid] || (b[uid] = {}), o = u[sheet];
  if (!o || ok / n > o.ok / o.n) { u[sheet] = { ok, n }; lsSet(FT_KEY, JSON.stringify(b)); }
}
function ruNorm(s) { return String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }
// Russian: any comma/semicolon-separated meaning (with or without the bracketed part) or the whole string
function ftRusOk(rus, val) {
  const v = ruNorm(val); if (!v) return false;
  const alts = new Set([ruNorm(rus), ruNorm(rus.replace(/\([^)]*\)/g, " "))]);
  rus.split(/[;,]/).forEach(p => { alts.add(ruNorm(p)); alts.add(ruNorm(p.replace(/\([^)]*\)/g, " "))); });
  alts.delete(""); return alts.has(v);
}
// Latin: exact form (endings matter); case, spaces, macrons/diacritics ignored; head word or full dictionary form
function ftLatOk(w, val) {
  const v = norm(val); if (!v) return false;
  return v === norm(w.kind === "phrase" ? w.lat : w.head) || v === norm(w.lat);
}
function startFinal(ui) { FT = { ui, sheet: "lr", rows: UNITS[ui].list.slice(), checked: false, retry: false }; document.body.style.overflow = "hidden"; ftShow(); }
function ftFrame(body, foot) {
  $("#session").innerHTML = `<div class="s-top"><button class="icon-btn" id="sClose" aria-label="Закрыть">${IC.x}</button><div class="ft-title">${esc(UNITS[FT.ui].title)} · итоговый тест</div></div>
    <div class="s-body ft-body">${body}</div><div class="s-foot" id="foot"><div class="in">${foot}</div></div>`;
  $("#session").classList.remove("hidden"); $("#session").scrollTop = 0; const sb = $("#session .s-body"); if (sb) sb.scrollTop = 0;
  $("#sClose").onclick = () => { if (FT && !FT.checked && [...document.querySelectorAll(".ft-in")].some(i => i.value.trim()) && !confirm("Выйти из теста? Ответы не сохранятся.")) return; FT = null; closeSession(true); };
}
function ftShow() {
  const lr = FT.sheet === "lr";
  const head = `<h2 class="ft-h">${lr ? "Лист 1 · латынь → русский" : "Лист 2 · русский → латынь"}${FT.retry ? " · ошибки" : ""}</h2>
    <div class="hint">${FT.rows.length} ${plural(FT.rows.length, "строка", "строки", "строк")}. Заполните все поля и отправьте лист целиком.</div>`;
  const rows = FT.rows.map((w, i) => `<div class="ft-row" id="ftr${i}"><div class="ft-q ${lr ? "lat" : ""}">${esc(lr ? w.lat : w.rus)}</div>
    <div class="ft-a"><input class="ft-in" data-i="${i}" type="text" ${lr ? 'lang="ru"' : 'lang="la"'} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="${i < FT.rows.length - 1 ? "next" : "done"}" aria-label="Ответ ${i + 1}"><div class="ft-fix"></div></div></div>`).join("");
  ftFrame(head + `<div class="card ft-sheet">${rows}</div>`, `<button class="btn" id="ftSend">Отправить на проверку</button>`);
  const ins = [...document.querySelectorAll(".ft-in")];
  ins.forEach((inp, i) => inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); if (ins[i + 1]) ins[i + 1].focus(); else inp.blur(); } });
  $("#ftSend").onclick = () => {
    const empty = ins.filter(i => !i.value.trim()).length;
    if (empty && !confirm(`Пустых полей: ${empty}. Всё равно отправить?`)) return;
    ftCheck(ins);
  };
}
function ftCheck(ins) {
  const lr = FT.sheet === "lr", wrong = [];
  let ok = 0;
  ins.forEach((inp, i) => {
    const w = FT.rows[i], good = lr ? ftRusOk(w.rus, inp.value) : ftLatOk(w, inp.value);
    const row = $("#ftr" + i); row.classList.add(good ? "ok" : "bad"); inp.readOnly = true;
    if (good) ok++; else { wrong.push(w); row.querySelector(".ft-fix").innerHTML = `${IC.x} <b>${esc(lr ? w.rus : (w.kind === "phrase" ? w.lat : w.head))}</b>${lr ? "" : ` <span class="muted">(${esc(w.lat)})</span>`}`; }
  });
  FT.checked = true; FT.wrong = wrong;
  const n = FT.rows.length;
  if (!FT.retry) ftSaveBest(UNITS[FT.ui].id, FT.sheet, ok, n);
  const best = (ftBest()[UNITS[FT.ui].id] || {})[FT.sheet];
  $("#session .ft-h").insertAdjacentHTML("afterend", `<div class="card ft-score ${ok === n ? "ok" : ""}"><b>${ok} / ${n}</b><span>${ok === n ? "Без ошибок!" : `ошибок: ${n - ok}`}${best ? ` · лучший результат: ${best.ok}/${best.n}` : ""}</span></div>`);
  $("#foot .in").innerHTML = `<div class="row2">${wrong.length ? `<button class="btn ghost" id="ftRetry">${IC.repeat} Повторить ошибки</button>` : ""}
    ${lr ? `<button class="btn" id="ftNext">Дальше: русский → латынь</button>` : `<button class="btn" id="ftDone">Готово</button>`}</div>`;
  $("#session .s-body").scrollTop = 0; $("#session").scrollTop = 0; window.scrollTo(0, 0);
  const r = $("#ftRetry"); if (r) r.onclick = () => { FT.rows = FT.wrong; FT.checked = false; FT.retry = true; ftShow(); };
  const nx = $("#ftNext"); if (nx) nx.onclick = () => { FT.sheet = "rl"; FT.rows = UNITS[FT.ui].list.slice(); FT.checked = false; FT.retry = false; ftShow(); };
  const d = $("#ftDone"); if (d) d.onclick = () => { FT = null; closeSession(true); };
}

\">rami nervorum</span>.</div></div>","st":[]},{"id":"d2-i1","ans":"Nom. Pl. («ветви»)","parse":"","st":[{"k":"ch","q":"В <span class=\"lat\">rami nervorum</span> слово <span class=\"lat\">rami</span> — это…","a":["Nom. Pl. («ветви»)"],"o":["Nom. Pl. («ветви»)","Gen. Sg.","Gen. Pl.","Nom. Sg."],"h":"Первое слово — «что?». Несколько ветвей → Nom. Pl. на -i.","lat":false}]},{"id":"d2-why","ans":"nervus — 2 скл.: Gen. Pl. -orum","parse":"","st":[{"k":"ch","q":"Почему <span class=\"lat\">rami nervorum</span>, а не <span class=\"lat\">rami nervarum</span>?","a":["nervus — 2 скл.: Gen. Pl. -orum"],"o":["nervus — 2 скл.: Gen. Pl. -orum","-arum бывает только у ветвей","nervorum — это Nom. Pl.","Так звучит лучше"],"h":"-arum — у 1 скл.; nervus, i m — 2 скл. → -orum.","lat":false}]},{"p":"teacher32-20","dir":"rl","full":true}]},{"id":"d2-l2","title":"Средний род: -um → -a","items":[{"id":"d2-l2t","th":true,"intro":"<span class=\"badge\">Средний род 2 скл. · с. 15–16</span>\n<div class=\"kl-th\"><p>В Nom. Pl. средний род получает <b>-a</b>, не <b>-i</b>: <span class=\"lat\">ligamentum</span> → <span class=\"lat\">ligamenta</span>. Не путайте это <b>-a</b> с Nom. Sg. 1 склонения.</p>\n<p>Греческие слова на <b>-on</b> (<span class=\"lat\">encephalon, ganglion, skeleton, colon</span>) склоняются так же: Gen. Sg. <b>-i</b>.</p></div>\n<span class=\"badge\">Разбор: septum nasi — перегородка носа</span>\n<div class=\"kl-parse\">\n<div>1) <span class=\"lat\">septum, i n</span> — что? → Nom. Sg. <b class=\"lat\">septum</b></div>\n<div>2) <span class=\"lat\">nasus, i m</span> — чего? одного носа → Gen. Sg. <b class=\"lat\">nasi</b></div></div>","st":[]},{"id":"d2-n1","ans":"Nom. Pl. среднего рода («связки»)","parse":"","st":[{"k":"ch","q":"<span class=\"lat\">ligamenta scapularum</span> — что такое <span class=\"lat\">ligamenta</span>?","a":["Nom. Pl. среднего рода («связки»)"],"o":["Nom. Pl. среднего рода («связки»)","Nom. Sg. 1 склонения","Gen. Sg.","Gen. Pl."],"h":"ligamentum → liga /* ---------- Словосочетания по склонениям (I–V): ① Урок → ② Тренировка → ③ Лист ---------- */
const DP_KEY = "latAnat.phDecl"; // новый ключ; latAnat.v2 / finalTest / krPrep / krLearn / lex2 не трогаем
function dpGet() { try { const d = JSON.parse(lsGet(DP_KEY) || "{}") || {}; return { l: d.l || {}, best: d.best || {}, replayAt: d.replayAt || {} }; } catch (e) { return { l: {}, best: {}, replayAt: {} }; } }
function dpSet(d) { lsSet(DP_KEY, JSON.stringify(d)); }
function dpUnit(d) { dpHydrate(); return DP_DATA[String(d)]; }
function dpTyOk(s, val) {
  if (s.lat) return (s.alts || [s.a]).some(a => norm(a) === norm(val));
  return (s.alts || [s.a]).some(a => ruNorm(a) === ruNorm(val));
}
function dpDiagnose(s, val) {
  if (!s.lat) return "";
  const alts = s.alts || [s.a];
  if (dpTyOk(s, val)) return "";
  const got = norm(val).split(/\s+/).filter(Boolean);
  const exp = norm(alts[0]).split(/\s+/).filter(Boolean);
  const toks = s.tokens || [];
  if (!got.length) return "Напишите словосочетание целиком.";
  if (got.length !== exp.length) {
    return `Должно быть ${exp.length} ${plural(exp.length, "слово", "слова", "слов")}: первое — «что?» (Nom.), дальше — «чего?» (Gen.). Нужно: <span class="lat">${esc(alts[0])}</span>`;
  }
  const msgs = [];
  for (let i = 0; i < Math.max(got.length, toks.length, exp.length); i++) {
    const t = toks[i], g = got[i] || "", e = (t && t.form) ? norm(t.form) : (exp[i] || "");

function dpHydrate() {
  if (typeof DP_DATA === "undefined" || DP_DATA._hydrated) return;
  const POOLX = (typeof DP_POOL !== "undefined" ? DP_POOL : null) || DP_DATA.pool || {};
  window.DP_POOL = POOLX;
  const pool = POOLX;
  const sec = DP_DATA.sec || DP_DATA;
  if (DP_DATA.sec) {
    window.DP_POOL = pool;
    Object.keys(sec).forEach(k => { DP_DATA[k] = sec[k]; });
  }
  Object.keys(DP_DATA).forEach(d => {
    if (d === "pool" || d === "sec" || d === "_hydrated") return;
    const U = DP_DATA[d];
    if (!U || typeof U !== "object") return;
    if (U.pids && !Array.isArray(U.phrases)) U.phrases = U.pids.map(id => (window.DP_POOL || {})[id]).filter(Boolean);
    if (Array.isArray(U.lessons)) {
      U.lessons = U.lessons.map(les => ({
        id: les.id, title: les.title,
        items: (les.items || []).map(it => it && it.p ? dpPhItem((window.DP_POOL || {})[it.p], it.dir || "rl", !!it.full) : it).filter(Boolean)
      }));
    }
  });
  DP_DATA._hydrated = true;
}
dpHydrate();

/* ---------- keyboard (tablets with keyboards, desktops) ---------- */
document.addEventListener("keydown", e => {
  if ($("#session").classList.contains("hidden")) return;
  if (!SES && !KS && !LS && !DS && !DT) return;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { closeSession(false); return; }
  if (/^[1-5]$/.test(e.key)) { const b = document.querySelectorAll("#opts .opt")[+e.key - 1]; if (b) { b.click(); e.preventDefault(); } return; }
  if (e.key === "Enter" || e.key === " ") {
    const b = $("#contBtn") || $("#fShow") || $("#fYes");
    if (b && document.activeElement !== b) { b.click(); e.preventDefault(); }
  }
});

/* ---------- PWA: service worker (offline cache + updates) ---------- */
const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
    // A new version took over: reload when it is safe (not in the middle of a lesson).
    let pending = false, reloaded = false;
    const reloadNow = () => { if (reloaded) return; reloaded = true; try { save(); } catch (e) {} location.reload(); };
    const tryReload = () => { if (pending && !document.querySelector(".session")) reloadNow(); };
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController) return; pending = true; tryReload(); });
    document.addEventListener("visibilitychange", () => { if (pending && document.hidden) reloadNow(); });
    document.addEventListener("click", () => setTimeout(tryReload, 0));
  });
}

document.addEventListener("visibilitychange", () => { if (document.hidden) { save(); CS.flush(); } });
window.addEventListener("pagehide", () => CS.flush());
load(); applyTheme(); render();
try {
  const ph = parseInt(new URLSearchParams(location.search).get("ph") || "", 10);
  if (ph >= 1 && ph <= 5) startDp(ph, "lesson");
} catch (e) {}
try { const w = window.Telegram && window.Telegram.WebApp; if (w && w.ready) w.ready(); } catch (e) {}
CS.init(() => { if (document.querySelector(".session:not(.hidden)")) return; load(); applyTheme(); render(); toast("Прогресс синхронизирован"); });
</script>
</body>
